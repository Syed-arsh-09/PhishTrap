# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

tone_instructions: "Be concise, constructive, and focus on security classification correctness, data leakage prevention, test coverage, and API robustness."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
      - "^master$"

  path_filters:
    - "!data/**"
    - "!models/**"
    - "!venv/**"
    - "!*.csv"
    - "!*.pkl"
    - "!*.parquet"

  path_instructions:
    - path: "src/features/**"
      instructions: |
        Verify URL normalization logic (stripping schemes, www, fragments) to prevent
        spurious feature leakage shortcuts.
    - path: "src/api/**"
      instructions: |
        Ensure input validation with Pydantic, proper HTTP error codes, and audit trail logging.
    - path: "src/pipeline/**"
      instructions: |
        Ensure failure cases route to human review rather than silent auto-allow.

chat:
  auto_reply: true

